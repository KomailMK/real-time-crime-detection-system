version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: crime-detect-db
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: crime_detect_db
      MYSQL_USER: crimedetect
      MYSQL_PASSWORD: crimedetect123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - crime-detect-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crime-detect-api
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: your_password
      MYSQL_DB: crime_detect_db
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SOCKETIO_ASYNC_MODE: eventlet
      FLASK_ENV: development
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - crime-detect-network
    command: python -m gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 app:app

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crime-detect-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_WS_URL: ws://localhost:5000/socket.io
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/.next
    networks:
      - crime-detect-network
    command: npm run dev

volumes:
  mysql_data:

networks:
  crime-detect-network:
    driver: bridge
